name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install uv==0.13.9

      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      - name: Smoke-test installed CLI
        run: uv run ntdsdotsqlite --help

      - name: Audit dependencies
        if: matrix.python-version == '3.14'
        run: |
          set -o pipefail
          uv pip install --python .venv/bin/python pip-audit==2.10.1
          uv export --locked --no-emit-project --format requirements-txt |
            uv run pip-audit --requirement /dev/stdin --strict --disable-pip
